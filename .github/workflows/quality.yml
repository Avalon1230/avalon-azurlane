name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run test:combat-source
      - run: npm run test:research-source
      - run: node scripts/verify-research-progression.mjs
      - run: node scripts/verify-portrait-source.mjs
  viewport:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: google-chrome --version
      - run: node scripts/viewport-smoke.mjs
      - run: node scripts/combat-interaction-smoke.mjs
      - run: node scripts/research-interaction-smoke.mjs
      - name: Capture merged v0.8.9 for visual comparison
        run: |
          git fetch origin 5445bc5763e4b7f30beb88840e8bc81d3a775714 --depth=1
          mkdir -p .audit/card-before
          git archive 5445bc5763e4b7f30beb88840e8bc81d3a775714 | tar -x -C .audit/card-before
          CARD_BASELINE=1 node scripts/research-interaction-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-ui-screenshots
          path: .audit/research-screens
          include-hidden-files: true
      - run: node scripts/augment-image-smoke.mjs
      - run: node scripts/collab-logo-smoke.mjs
