name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Require finalized release metadata on main
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-release-consistency.mjs --require-released
      - run: node scripts/audit-event-catalog.mjs
      - run: npm test
      - run: npm run test:combat-source
      - run: npm run test:chronicle-source
      - run: node scripts/verify-black-friday-source.mjs
      - run: npm run test:research-source
      - run: node scripts/verify-research-progression.mjs
      - run: node scripts/verify-portrait-source.mjs
  viewport:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: google-chrome --version
      - run: node scripts/release-state-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-state-rehearsal
          path: .audit/release-state
          include-hidden-files: true
      - run: node scripts/viewport-smoke.mjs
      - run: node scripts/events-interaction-smoke.mjs
      - run: node scripts/integrity-interaction-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-ui-screenshots
          path: .audit/integrity-screens
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronicle-ui-screenshots
          path: .audit/chronicle-screens
          include-hidden-files: true
      - run: node scripts/combat-interaction-smoke.mjs
      - run: node scripts/research-interaction-smoke.mjs
      - name: Capture pre-unified-bronze PR head for visual comparison
        run: |
          git fetch origin 62da901c0f50941bc183ab4903580fb99cdc0469 --depth=1
          mkdir -p .audit/card-before
          git archive 62da901c0f50941bc183ab4903580fb99cdc0469 | tar -x -C .audit/card-before
          CARD_BASELINE=1 node scripts/research-interaction-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-ui-screenshots
          path: .audit/research-screens
          include-hidden-files: true
      - run: node scripts/augment-image-smoke.mjs
      - run: node scripts/collab-logo-smoke.mjs
