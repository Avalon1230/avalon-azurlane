name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run test:combat-source
      - run: npm run test:research-source
  viewport:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: google-chrome --version
      - run: node scripts/viewport-smoke.mjs
      - run: node scripts/combat-interaction-smoke.mjs
      - run: node scripts/research-interaction-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-ui-screenshots
          path: .audit/research-screens
          include-hidden-files: true
      - run: node scripts/augment-image-smoke.mjs
      - run: node scripts/collab-logo-smoke.mjs
