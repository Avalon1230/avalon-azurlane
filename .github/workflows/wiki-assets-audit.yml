name: Wiki artwork and faction metadata audit
on:
  pull_request:
    paths:
      - scripts/audit_wiki_assets.py
      - .github/workflows/wiki-assets-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe a handful of Koumakan files using MediaWiki metadata API
        run: python scripts/audit_wiki_assets.py
